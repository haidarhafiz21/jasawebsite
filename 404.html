<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halaman tidak ditemukan | Haidar Hafiz</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Newsreader"; src: url("/assets/fonts/newsreader-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("/assets/fonts/plus-jakarta-sans.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 10px;
      background: #F3EEE6;
      font: 400 1rem/1.6 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: rgba(244, 239, 230, .9);
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 20px;
      text-align: center;
      border-radius: clamp(22px, 3vw, 38px);
      background:
        radial-gradient(60% 46% at 50% 0%, rgba(167, 189, 134, .2), transparent 72%),
        radial-gradient(36% 34% at 94% 98%, rgba(180, 85, 44, .3), transparent 72%),
        #121911;
    }
    .code { margin: 0; font: italic 400 clamp(5rem, 22vw, 11rem)/1 "Newsreader", Georgia, serif; color: #EBA982; letter-spacing: -.04em; }
    h1 { margin: .3em 0 0; font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.1; letter-spacing: -.04em; color: #F4EFE6; }
    p { margin: 1em auto 0; max-width: 30em; }
    a {
      display: inline-flex; align-items: center; gap: .5em;
      margin-top: 2em; padding: 0 1.5em; height: 52px;
      border-radius: 999px;
      background: #F4EFE6; color: #1E1A15;
      font-weight: 600; text-decoration: none;
      transition: background-color .3s;
    }
    a:hover { background: #fff; }
    a:focus-visible { outline: 2px solid #EBA982; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Halaman ini tidak ditemukan.</h1>
    <p>Mungkin alamatnya salah ketik atau halamannya sudah dipindah. Kembali ke beranda untuk melihat layanan dan hasil karya.</p>
    <a href="/">Kembali ke beranda <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
